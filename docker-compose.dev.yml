# Local development services — Postgres + a mailpit mail sink
# Credentials match .env.example defaults so no extra config is needed.
#
# Usage:
#   pnpm dev:services          # start in background
#   docker compose -f docker-compose.dev.yml down   # stop
#   docker compose -f docker-compose.dev.yml down -v # stop + delete data
#
# Each checkout uses its own database on this one Postgres (`cockpit_context` in
# the main checkout, `cockpit_context_wt_<hash>` in a git worktree, plus
# `<name>_shadow`). `pnpm db:worktree` creates them; `pnpm db:reset:local`
# recreates only this checkout's database. Reset drops only databases marked
# disposable: `cockpit_context` is marked by the init script below on a fresh
# volume, the others by `pnpm db:worktree`. A volume initialized before the
# mark existed is adopted once by a person: `pnpm db:worktree --adopt`.

name: cockpit-context-dev

services:
  postgres:
    # PostgreSQL 18 pin; PG_MAJOR in the app image matches.
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: cockpit_context
      POSTGRES_USER: postgres
      # DEV ONLY — do not use this password in production.
      POSTGRES_PASSWORD: password
    ports:
      # Bind to loopback only. A bare "5432:5432" binds 0.0.0.0 and, because
      # Docker writes its own iptables rules ahead of ufw/firewalld, would
      # expose Postgres to the public internet on a VPS — with the dev password
      # below — even behind a closed host firewall. localhost dev is unaffected.
      - "127.0.0.1:5432:5432"
    volumes:
      - cockpit-context-dev-postgres:/var/lib/postgresql
      # Marks POSTGRES_DB as a disposable local database on first init.
      - ./scripts/db/dev-postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during initdb the entrypoint's temporary server listens on the
      # Unix socket only, so a socket check reports ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local mail sink — captures every outgoing email (signup verification,
  # password reset, 2FA codes) so the real flows work offline with zero
  # credentials. `pnpm setup:app` points .env at it (SMTP_HOST=localhost,
  # SMTP_PORT=1025); read captured mail at http://localhost:8025. Set real
  # SMTP_* values in .env to send through a provider instead — the app
  # switches over with no other change.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # Loopback only — see the postgres note above.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  cockpit-context-dev-postgres:
